<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartShelf — Food Expiry Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --border: #E2DDD4;
      --text: #1A1A18;
      --muted: #6B6860;
      --accent: #2D6A4F;
      --accent-light: #D8EDDF;
      --accent-mid: #52B788;
      --warn: #E76F51;
      --warn-light: #FAE9E4;
      --danger: #C1121F;
      --danger-light: #FDECEA;
      --ok-light: #D8EDDF;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 640px;
      margin: 0 auto 2.5rem;
    }

    header .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .tagline {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 640px;
      margin: 0 auto 1.5rem;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    input[type="text"],
    input[type="date"],
    select {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--accent-mid);
      background: #fff;
    }

    button.primary {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
    }

    button.primary:hover { background: #245a41; }
    button.primary:active { transform: scale(0.97); }
    button.primary:disabled { background: #aaa; cursor: not-allowed; }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
    }

    .filter-btn {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 14px;
    }

    .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

    .loading {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 14px;
    }

    .error-msg {
      background: var(--danger-light);
      color: var(--danger);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead th {
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 0 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }

    tbody td {
      padding: 11px 8px;
      vertical-align: middle;
    }

    .item-name { font-weight: 500; }
    .item-cat {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 999px;
      display: inline-block;
    }

    .cat-dairy    { background: #EEF2FF; color: #3730A3; }
    .cat-produce  { background: var(--ok-light); color: var(--accent); }
    .cat-meat     { background: var(--warn-light); color: #B94A2C; }
    .cat-frozen   { background: #E0F2FE; color: #0369A1; }
    .cat-pantry   { background: #FEF9C3; color: #854D0E; }
    .cat-other    { background: #F3F4F6; color: #374151; }

    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 999px;
      display: inline-block;
    }

    .badge-ok      { background: var(--ok-light); color: var(--accent); }
    .badge-soon    { background: var(--warn-light); color: var(--warn); }
    .badge-expired { background: var(--danger-light); color: var(--danger); }
    .badge-today   { background: #FEF9C3; color: #854D0E; }

    .days-text {
      font-size: 13px;
      color: var(--muted);
    }

    .del-btn {
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.1s;
      font-family: var(--font-body);
    }
    .del-btn:hover { background: var(--danger-light); color: var(--danger); }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 640px;
      margin: 0 auto 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 500;
      color: var(--text);
    }

    .stat-value.warn { color: var(--warn); }
    .stat-value.danger { color: var(--danger); }

    .api-notice {
      max-width: 640px;
      margin: 0 auto;
      background: var(--accent-light);
      border: 1px solid var(--accent-mid);
      border-radius: var(--radius);
      padding: 0.875rem 1.25rem;
      font-size: 13px;
      color: var(--accent);
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat-card { padding: 0.75rem; }
      .stat-value { font-size: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="logo-icon">🥬</div>
    <h1>SmartShelf</h1>
  </div>
  <p class="tagline">Track your food. Cut the waste.</p>
</header>

<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">Total items</div>
    <div class="stat-value" id="stat-total">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Expiring soon</div>
    <div class="stat-value warn" id="stat-soon">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Expired</div>
    <div class="stat-value danger" id="stat-expired">0</div>
  </div>
</div>

<div class="card">
  <div class="card-title">Add item</div>
  <div id="add-error"></div>
  <div class="form-row">
    <div class="field">
      <label for="item-name">Item name</label>
      <input type="text" id="item-name" placeholder="e.g. Greek yogurt" autocomplete="off" />
    </div>
    <div class="field">
      <label for="item-cat">Category</label>
      <select id="item-cat">
        <option value="produce">Produce</option>
        <option value="dairy">Dairy</option>
        <option value="meat">Meat / Fish</option>
        <option value="frozen">Frozen</option>
        <option value="pantry">Pantry</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="field">
      <label for="item-date">Expiry date</label>
      <input type="date" id="item-date" />
    </div>
    <button class="primary" id="add-btn" onclick="addItem()">Add</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Your shelf</div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('soon', this)">Expiring soon</button>
    <button class="filter-btn" onclick="setFilter('expired', this)">Expired</button>
    <button class="filter-btn" onclick="setFilter('ok', this)">Good</button>
  </div>

  <div id="table-wrap">
    <div class="loading">Loading your shelf...</div>
  </div>
</div>

<div class="api-notice">
  <span>✅</span>
  <span><strong>Cloud powered.</strong> Items are stored in DynamoDB via Lambda + API Gateway.</span>
</div>

<script>
  const API_URL = 'https://1pggtbw2x6.execute-api.us-west-2.amazonaws.com';
  let items = [];
  let activeFilter = 'all';

  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function daysUntil(dateStr) {
    const diff = new Date(dateStr) - new Date(today());
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
  }

  function getStatus(dateStr) {
    const d = daysUntil(dateStr);
    if (d < 0) return 'expired';
    if (d === 0) return 'today';
    if (d <= 3) return 'soon';
    return 'ok';
  }

  function statusBadge(dateStr) {
    const d = daysUntil(dateStr);
    const status = getStatus(dateStr);
    const labels = { expired: 'Expired', today: 'Today!', soon: `${d}d left`, ok: `${d}d left` };
    const classes = { expired: 'badge-expired', today: 'badge-today', soon: 'badge-soon', ok: 'badge-ok' };
    return `<span class="badge ${classes[status]}">${labels[status]}</span>`;
  }

  function catBadge(cat) {
    const labels = { dairy: 'Dairy', produce: 'Produce', meat: 'Meat/Fish', frozen: 'Frozen', pantry: 'Pantry', other: 'Other' };
    return `<span class="item-cat cat-${cat}">${labels[cat] || cat}</span>`;
  }

  async function fetchItems() {
    try {
      const res = await fetch(`${API_URL}/items`);
      const data = await res.json();
      items = data.items || [];
      render();
    } catch (e) {
      document.getElementById('table-wrap').innerHTML = `<div class="error-msg">Could not load items. Check your API or CORS settings.</div>`;
    }
  }

  async function addItem() {
    const name = document.getElementById('item-name').value.trim();
    const date = document.getElementById('item-date').value;
    const cat  = document.getElementById('item-cat').value;
    const errorDiv = document.getElementById('add-error');
    const btn = document.getElementById('add-btn');

    errorDiv.innerHTML = '';
    if (!name || !date) {
      errorDiv.innerHTML = '<div class="error-msg">Please enter both a name and expiry date.</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Adding...';

    try {
      const res = await fetch(`${API_URL}/items`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, category: cat, expiryDate: date })
      });

      if (!res.ok) throw new Error('Failed to add item');

      document.getElementById('item-name').value = '';
      document.getElementById('item-date').value = '';
      await fetchItems();
    } catch (e) {
      errorDiv.innerHTML = '<div class="error-msg">Could not add item. Please try again.</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add';
    }
  }

  async function deleteItem(id) {
    try {
      const res = await fetch(`${API_URL}/items/${id}`, {
        method: 'DELETE'
      });
      if (!res.ok) throw new Error('Failed to delete item');
      await fetchItems();
    } catch (e) {
      alert('Could not delete item. Please try again.');
    }
  }

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const expired = items.filter(i => getStatus(i.expiryDate) === 'expired').length;
    const soon    = items.filter(i => ['soon','today'].includes(getStatus(i.expiryDate))).length;
    document.getElementById('stat-total').textContent   = items.length;
    document.getElementById('stat-soon').textContent    = soon;
    document.getElementById('stat-expired').textContent = expired;

    let filtered = items;
    if (activeFilter === 'soon')    filtered = items.filter(i => ['soon','today'].includes(getStatus(i.expiryDate)));
    if (activeFilter === 'expired') filtered = items.filter(i => getStatus(i.expiryDate) === 'expired');
    if (activeFilter === 'ok')      filtered = items.filter(i => getStatus(i.expiryDate) === 'ok');

    filtered = [...filtered].sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));

    const wrap = document.getElementById('table-wrap');
    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="empty-state"><div class="icon">✅</div>${activeFilter === 'all' ? 'Add your first item above to get started.' : 'No items in this category.'}</div>`;
      return;
    }

    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Expiry</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(i => `
            <tr>
              <td class="item-name">${i.name}</td>
              <td>${catBadge(i.category)}</td>
              <td class="days-text">${i.expiryDate}</td>
              <td>${statusBadge(i.expiryDate)}</td>
              <td><button class="del-btn" onclick="deleteItem('${i.id}')">Remove</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  fetchItems();
</script>
</body>
</html>
